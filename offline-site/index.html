<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #343a40;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      padding: 40px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
      color: #dc3545;
    }
    p {
      line-height: 1.6;
      font-size: 1.1em;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Unavailable</h1>
    <p>This website has been taken down pending subscription payment.</p>
  </div>
</body>
</html>
